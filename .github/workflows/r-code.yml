name: Publication reconstruction

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    name: October aggregate reconstruction and source checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'

      # Everything run_all.R needs ships with R, so there is nothing to install.
      - name: Parse every R file
        run: |
          Rscript -e 'fs <- list.files(".", "[.]R$", recursive = TRUE, full.names = TRUE);
            for (f in fs) tryCatch(parse(f), error = function(e) stop(f, ": ", conditionMessage(e)));
            cat(length(fs), "R files parsed\n")'

      - name: Verify imported source hashes and publication file types
        run: python3 tests/check_source_integrity.py

      - name: Check public repository contents
        run: python3 tests/check_release_contents.py

      - name: Test fail-closed integrity gates
        run: python3 tests/check_integrity_contract.py

      - name: Test inert sourcing and isolated runner safety
        run: Rscript --vanilla tests/check_current_runner.R

      - name: Test protected outputs and crossover confidence-set reporting
        run: Rscript --vanilla tests/check_reconstruction_contract.R

      - name: Test crossover inference and risk reporting on synthetic data
        working-directory: model-fitting/current
        run: |
          Rscript --vanilla tests/test_age_crossover.R
          Rscript --vanilla tests/test_effect_reporting.R

      # This checks aggregate reconstruction, not a 30-million-record rerun.
      # No record-level inputs are distributed or downloaded by CI.
      - name: Reproduce the tables and figures
        run: Rscript --vanilla run_all.R

      - name: Keep the rebuilt output from this run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tables-and-figures
          path: output/
          retention-days: 14
